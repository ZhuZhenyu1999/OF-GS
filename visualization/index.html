<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TEST2-SLAM · 实时可视化</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e2e9f4;background:#0c111c}
    *{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 28px;border-bottom:1px solid #253147;background:#111929}
    h1{font-size:19px;margin:0;letter-spacing:.02em}header p{margin:3px 0 0;color:#92a2bc;font-size:12px}.actions{display:flex;align-items:center;gap:12px}button{font:inherit;color:#e2e9f4;background:#253b59;border:1px solid #3a5779;border-radius:7px;padding:7px 14px;cursor:pointer}button:hover{background:#315075}button:disabled{opacity:.45;cursor:default}.status{color:#72d3bf;white-space:nowrap}.status.offline{color:#ffbc7c}
    main{max-width:1800px;margin:auto;padding:22px 28px}.stats{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}.stat{min-width:145px;flex:1;background:#131e30;border:1px solid #26344b;border-radius:9px;padding:12px 17px}.stat small{display:block;color:#91a2bd}.stat strong{display:block;font-size:23px;font-weight:550;margin-top:3px;font-variant-numeric:tabular-nums}
    .workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px}.panel{border:1px solid #29374e;border-radius:10px;overflow:hidden;background:#101827}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px;border-bottom:1px solid #26344b}.panel-head h2{font-size:14px;font-weight:550;margin:0}.panel-head button{font-size:12px;padding:4px 10px}.map-wrap{position:relative;min-height:530px;height:calc(100vh - 300px);max-height:900px}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#7e91af;padding:25px;pointer-events:none}.legend{position:absolute;left:16px;bottom:12px;display:flex;gap:17px;font-size:12px;color:#97a9c4;background:#101827b0;padding:5px 8px;border-radius:4px}.legend b{font-weight:400;color:#63d8df}.legend span:last-child b{color:#ffd36b}.map-help{padding:9px 16px;color:#91a2bd;font-size:12px;border-top:1px solid #26344b}.images{display:flex;flex-direction:column;gap:18px}.image-wrap{position:relative;min-height:170px;aspect-ratio:1.5;background:#080d16;display:flex;justify-content:center;align-items:center}.image-wrap img{width:100%;height:100%;object-fit:contain;display:none}.image-wrap .empty{position:absolute;color:#7e91af;font-size:13px}.note{margin:12px 0 0;font-size:12px;color:#91a2bd;min-height:18px;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#ffb098}
    @media(max-width:960px){.workspace{grid-template-columns:1fr}.map-wrap{height:55vh;min-height:350px}.images{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:600px){header{padding:15px;align-items:flex-start;flex-direction:column}main{padding:15px}.stat{min-width:110px;padding:10px}.stat strong{font-size:19px}.images{display:flex}.actions{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
<header><div><h1>TEST2-SLAM <span style="color:#8fa7cb;font-weight:400">/ 实时可视化</span></h1><p>相机轨迹 · 高斯中心点云 · 已定位视角高斯渲染</p></div><div class="actions"><span class="status" id="connection">正在连接…</span><button id="pause" disabled>暂停</button></div></header>
<main>
  <div class="stats"><div class="stat"><small>输入帧</small><strong id="frames">—</strong></div><div class="stat"><small>关键帧</small><strong id="keyframes">—</strong></div><div class="stat"><small>高斯数量</small><strong id="gaussians">—</strong></div><div class="stat"><small>显示点数</small><strong id="points">—</strong></div></div>
  <div class="workspace">
    <section class="panel"><div class="panel-head"><h2>三维地图 · 高斯中心采样</h2><button id="reset">适应地图</button></div><div class="map-wrap"><canvas id="map"></canvas><div id="map-empty" class="overlay">等待初始化与地图数据…</div><div class="legend"><span><b>━━</b> 相机轨迹</span><span><b>△</b> <span id="camera-label">最近定位相机</span></span></div></div><div class="map-help">拖动旋转 · 滚轮缩放 · Shift / 右键拖动平移 · 双击适应地图</div></section>
    <div class="images"><section class="panel"><div class="panel-head"><h2 id="input-title">当前输入图像</h2></div><div class="image-wrap"><span class="empty" id="input-empty">等待图像…</span><img id="input" alt="当前输入图像"></div></section><section class="panel"><div class="panel-head"><h2 id="render-title">已定位视角 · 高斯渲染</h2></div><div class="image-wrap"><span class="empty" id="render-empty">建立地图后显示</span><img id="render" alt="已定位相机视角对应的高斯渲染"></div></section></div>
  </div>
  <p class="note" id="message">暂停在当前帧处理结束后生效。三维交互视图显示采样的高斯中心点，右侧显示实际高斯渲染。</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas=$('map');let gl=canvas.getContext('webgl',{antialias:true,alpha:false});
let snapshot={}, revision=-1, fitted=false, yaw=0, pitch=-.22, distance=10, target=[0,0,0], extent=1;
let pointCount=0, trajectoryCount=0, cameraCount=0, program, pointBuffer, trajectoryBuffer, cameraBuffer, mapRevision=null;
const statusNames={initializing:'初始化中',bootstrap:'初始化中',bootstrapping:'初始化中',running:'运行中',finalizing:'评测与保存',complete:'已完成',error:'运行出错',stopped:'已停止'};
const vec={sub:(a,b)=>a.map((v,i)=>v-b[i]),dot:(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit:a=>{const n=Math.hypot(...a)||1;return a.map(x=>x/n)}};
function multiply(a,b){const c=new Float32Array(16);for(let col=0;col<4;col++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)c[col*4+row]+=a[k*4+row]*b[col*4+k];return c;}
function matrix(){const aspect=canvas.width/canvas.height,f=1/Math.tan(Math.PI/8),near=Math.max(distance/10000,.00001),far=Math.max(distance+extent*8,near*1000);const p=new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);const offset=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)].map(x=>x*distance),eye=target.map((v,i)=>v+offset[i]),z=vec.unit(vec.sub(eye,target)),x=vec.unit(vec.cross([0,-1,0],z)),y=vec.cross(z,x);const view=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-vec.dot(x,eye),-vec.dot(y,eye),-vec.dot(z,eye),1]);return multiply(p,view);}
function initGL(){
  function shader(kind,source){const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
  program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 position;attribute vec3 color;uniform mat4 matrix;uniform float size;varying vec3 vColor;void main(){gl_Position=matrix*vec4(position,1.0);gl_PointSize=size;vColor=color;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);program.position=gl.getAttribLocation(program,'position');program.color=gl.getAttribLocation(program,'color');program.matrix=gl.getUniformLocation(program,'matrix');program.size=gl.getUniformLocation(program,'size');pointBuffer=gl.createBuffer();trajectoryBuffer=gl.createBuffer();cameraBuffer=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.clearColor(.035,.055,.09,1);
}
function upload(buffer,points,colors,fallback){const data=new Float32Array(points.length*6);points.forEach((p,i)=>{data.set(p,i*6);data.set(colors?.[i]||fallback,i*6+3);});gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);}
function fit(){const data=(snapshot.points?.length?snapshot.points:snapshot.trajectory)||[];if(!data.length)return;let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of data)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k]);}target=lo.map((v,i)=>(v+hi[i])/2);extent=Math.max(Math.hypot(...vec.sub(hi,lo)),.01);distance=extent*1.4;yaw=0;pitch=-.22;fitted=true;updateCamera();draw();}
function updateCamera(){if(!gl)return;const pose=snapshot.camera_pose;if(!pose){cameraCount=0;return;}const size=Math.max(extent*.035,.0005),corner=[[-.7,-.45,1],[.7,-.45,1],[.7,.45,1],[-.7,.45,1]];function world(p){return [0,1,2].map(i=>pose[i][3]+size*(pose[i][0]*p[0]+pose[i][1]*p[1]+pose[i][2]*p[2]));}const origin=world([0,0,0]),corners=corner.map(world),lines=[];for(let i=0;i<4;i++)lines.push(origin,corners[i],corners[i],corners[(i+1)%4]);cameraCount=lines.length;upload(cameraBuffer,lines,null,[1,.8,.35]);}
function updateMap(){if(!gl)return;const points=snapshot.points||[],trajectory=snapshot.trajectory||[],nextMapRevision=snapshot.map_revision??snapshot.revision;if(nextMapRevision!==mapRevision){mapRevision=nextMapRevision;pointCount=points.length;upload(pointBuffer,points,snapshot.colors,[.65,.75,.85]);}trajectoryCount=trajectory.length;upload(trajectoryBuffer,trajectory,null,[.3,.87,.9]);$('map-empty').style.display=(pointCount||trajectoryCount)?'none':'flex';if(!fitted&&pointCount)fit();updateCamera();draw();}
function draw(){if(!gl||!program)return;const rect=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(rect.width*ratio)),h=Math.max(1,Math.round(rect.height*ratio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(program.matrix,false,matrix());function render(buffer,count,mode,size){if(!count)return;gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(program.position);gl.vertexAttribPointer(program.position,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(program.color);gl.vertexAttribPointer(program.color,3,gl.FLOAT,false,24,12);gl.uniform1f(program.size,size*ratio);gl.drawArrays(mode,0,count);}render(pointBuffer,pointCount,gl.POINTS,2);gl.disable(gl.DEPTH_TEST);render(trajectoryBuffer,trajectoryCount,gl.LINE_STRIP,1);render(cameraBuffer,cameraCount,gl.LINES,1);gl.enable(gl.DEPTH_TEST);}
if(gl){try{initGL();new ResizeObserver(draw).observe(canvas);}catch(error){gl=null;$('map-empty').textContent='无法初始化三维视图：'+error.message;}}else{$('map-empty').textContent='浏览器未启用 WebGL。请启用硬件加速或更换浏览器；图像和状态仍可查看。';}
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.pan||e.shiftKey){const scale=distance/Math.max(canvas.clientHeight,1),right=[Math.cos(yaw),0,Math.sin(yaw)];target=target.map((v,i)=>v-dx*scale*right[i]+(i===1?-dy*scale:0));}else{yaw-=dx*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch-dy*.008));}draw();});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>drag=null);canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(extent*.001,Math.min(extent*1000,distance*Math.exp(Math.max(-1,Math.min(1,e.deltaY*.001)))));draw();},{passive:false});canvas.addEventListener('dblclick',fit);$('reset').onclick=fit;
function updateImage(name,value){const img=$(name),empty=$(name+'-empty');if(value&&typeof value==='string'&&value.startsWith('data:image/')){if(img.getAttribute('src')!==value)img.src=value;img.style.display='block';empty.style.display='none';}else{img.removeAttribute('src');img.style.display='none';empty.style.display='block';}}
function frameLabel(id){return Number.isInteger(id)&&id>=0?`第 ${id+1} 帧`:'';}
function updateState(s){snapshot=s;const frame=Math.max(0,(s.frame_id??-1)+1);$('frames').textContent=`${frame} / ${s.total_frames||'—'}`;$('keyframes').textContent=(s.num_keyframes||0).toLocaleString();$('gaussians').textContent=(s.num_gaussians||0).toLocaleString();$('points').textContent=(s.points?.length||0).toLocaleString();$('connection').className='status';$('connection').textContent=s.paused?'已请求暂停（帧边界生效）':(statusNames[s.status]||s.status||'已连接');$('pause').disabled=['complete','error','stopped','finalizing'].includes(s.status);$('pause').textContent=s.paused?'继续':'暂停';$('message').className='note'+(s.status==='error'||s.render_error?' error':'');$('message').textContent=[s.message,s.render_error].filter(Boolean).join(' · ')||'暂停在当前帧处理结束后生效。三维交互视图显示采样的高斯中心点，右侧显示实际高斯渲染。';$('input-title').textContent='当前输入图像'+(frameLabel(s.frame_id)?' · '+frameLabel(s.frame_id):'');$('render-title').textContent='高斯渲染'+(frameLabel(s.render_frame_id)?' · '+frameLabel(s.render_frame_id):' · 已定位视角');$('camera-label').textContent='最近定位相机'+(frameLabel(s.camera_frame_id)?' · '+frameLabel(s.camera_frame_id):'');updateImage('input',s.input_image);updateImage('render',s.render_image);updateMap();}
let controlPending=false;$('pause').onclick=async()=>{if(controlPending)return;controlPending=true;$('pause').disabled=true;try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:snapshot.paused?'resume':'pause'})});if(!r.ok)throw Error((await r.json()).error||r.statusText);revision=-1;}catch(error){$('message').textContent='控制失败：'+error.message;}finally{controlPending=false;}};
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error(r.statusText);const state=await r.json();if(state.revision!==revision){revision=state.revision;updateState(state);}else{$('connection').className='status';$('connection').textContent=state.paused?'已请求暂停（帧边界生效）':(statusNames[state.status]||state.status);if(!controlPending)$('pause').disabled=['complete','error','stopped','finalizing'].includes(state.status);}}catch(error){$('connection').textContent='连接已断开 · 正在重试';$('connection').className='status offline';$('pause').disabled=true;}finally{setTimeout(poll,700);}}
poll();
</script>
</body>
</html>
