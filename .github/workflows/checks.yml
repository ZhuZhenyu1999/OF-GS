name: Source and CPU checks

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy opencv-python-headless pytest plyfile tqdm openpyxl pillow
      - name: Validate source interfaces
        run: python scripts/calibration_preflight.py --check_local_ba --check_trajectory_stages
      - name: Run regression tests
        run: python -m pytest tests -q -rs
      # CUDA renderer tests skip on this CPU runner. Compile the customized
      # extensions and run tests/test_renderer_smoke.py on the target GPU host.
